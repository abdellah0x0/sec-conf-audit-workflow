{% extends "base.html" %}
{% block title %}New audit — Audit Console{% endblock %}
{% block content %}
<div class="page-header">
  <h1>New audit</h1>
  <a href="{{ url_for('dashboard') }}" class="link-back">&larr; back to history</a>
</div>



<form method="POST" class="panel-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div class="field">
      <label for="host">host</label>
      <input type="text" id="host" name="host" placeholder="hostname or IP address" required>
    </div>
    <div class="field">
      <label for="port">port</label>
      <input type="number" id="port" name="port" value="22" min="1" max="65535">
    </div>
    <div class="field">
      <label for="user">ssh user</label>
      <input type="text" id="user" name="user" value="root">
    </div>
    <div class="field">
      <label for="benchmark">benchmark</label>
      <select id="benchmark" name="benchmark" required {% if not benchmarks %}disabled{% endif %}>
        <option value="" disabled selected>select a benchmark</option>
        {% for b in benchmarks %}
        <option value="{{ b }}">{{ b }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field field-wide">
      <label for="password">password</label>
      <input type="password" id="password" name="password" placeholder="leave blank if using a key" autocomplete="new-password">
    </div>
    <div class="field field-wide">
      <label for="key">private key path</label>
      <input type="text" id="key" name="key" placeholder="leave blank if using a password">
    </div>
  </div>
  <p class="form-note">Provide either a password or a key path. Credentials are used only to
    open this session's SSH connection and are never stored.</p>
  <button type="submit" class="btn btn-primary" {% if not benchmarks %}disabled{% endif %}>Run audit</button>
</form>
{% endblock %}
